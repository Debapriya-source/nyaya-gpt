[project]
name = "nyaya-gpt"
version = "0.1.0"
description = "Legal AI assistant using ReAct + RAG for Indian legal documents"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faiss-cpu~=1.8.0",
    "langchain~=0.3.0",
    "langchain-community~=0.3.0",
    "langchain-core~=0.3.5",
    "langchain-groq~=0.2.0",
    "langchain-huggingface~=0.1.0",
    "langchain-ollama>=0.2.0,<1.0.0",
    "langchain-text-splitters~=0.3.0",
    "numpy~=1.26.4",
    "pandas~=2.2.3",
    "PyPDF2~=3.0.1",
    "python-dotenv~=1.0.1",
    "pydantic~=2.9.2",
    "scikit-learn~=1.5.2",
    "sentence-transformers~=3.1.1",
    "streamlit~=1.38.0",
    "torch~=2.4.1",
    "transformers~=4.44.2",
]

[dependency-groups]
dev = []
