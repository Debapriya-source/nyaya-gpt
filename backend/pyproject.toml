[project]
name = "nyaya-gpt-backend"
version = "0.2.0"
description = "FastAPI backend for Nyaya-GPT legal AI assistant (vectorless tree-based RAG)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain~=0.3.0",
    "langchain-community~=0.3.0",
    "langchain-core~=0.3.5",
    "langchain-groq~=0.2.0",
    "langchain-ollama>=0.2.0,<1.0.0",
    "PyPDF2~=3.0.1",
    "python-dotenv~=1.0.1",
    "pydantic~=2.9.2",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = []
